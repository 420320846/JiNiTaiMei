name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Install Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > android/local.properties
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            yes | $SDK/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            (wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip && \
             unzip -q /tmp/clt.zip -d /tmp/clt && \
             mkdir -p $SDK/cmdline-tools/latest && \
             mv /tmp/clt/cmdline-tools/* $SDK/cmdline-tools/latest/ && \
             yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1)
          fi

      - name: Build APK
        continue-on-error: true
        run: |
          cd android
          gradle assembleDebug --no-daemon 2>&1

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "番茄钟 ${{ github.ref_name }}" \
              --notes "APK 下载后可在 Android 设备上安装使用。" \
              "$APK_PATH"
          else
            echo "No APK found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
