name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android SDK components
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Installing Android SDK platform 34..."
            cmdline_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
            if [ -f "$cmdline_tools/sdkmanager" ]; then
              yes | "$cmdline_tools/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1
            elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
              yes | "$ANDROID_HOME/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1
            else
              echo "Downloading cmdline tools..."
              wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip
              unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1
            fi
          else
            echo "Android SDK platform 34 already installed"
          fi

      - name: Build Debug APK
        run: |
          cd android && gradle assembleDebug --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Tomato Timer ${{ github.ref_name }}" \
            --notes "Download the APK and install it on your Android device." \
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
