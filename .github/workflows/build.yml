name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo 'sdk.dir=/usr/local/lib/android/sdk' > android/local.properties

      - name: Verify Android SDK
        run: ls -la $ANDROID_HOME/platforms/ || echo "Need to install SDK"

      - name: Install Android SDK if missing
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Installing Android SDK components..."
            mkdir -p $HOME/android-sdk/cmdline-tools
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip
            unzip -q /tmp/clt.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
            echo 'sdk.dir=' + d + 'HOME/android-sdk' > android/local.properties
            export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
            yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1
          fi

      - name: Download Gradle
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Tomato Timer ${{ github.ref_name }}" \
            --notes "Download and install on your Android device." \
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}