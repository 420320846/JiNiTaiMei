name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Install Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > android/local.properties
          echo "sdk.dir=$SDK" > local.properties
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "=== Installing platform 34 ==="
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            yes | $SDK/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            (wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip && \
             unzip -q /tmp/clt.zip -d /tmp/clt && \
             mkdir -p $SDK/cmdline-tools/latest && \
             mv /tmp/clt/cmdline-tools/* $SDK/cmdline-tools/latest/ && \
             yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1)
          fi
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Build and capture output
        id: build
        continue-on-error: true
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: Show build log
        run: |
          cat /tmp/build.log 2>/dev/null || echo "No build log found"
          echo "---"
          wc -l /tmp/build.log 2>/dev/null
          echo "---"
          tail -200 /tmp/build.log 2>/dev/null || echo "no log"

      - name: Gradle tasks debug
        if: steps.build.outputs.exitcode != '0'
        run: |
          cd android
          gradle tasks --no-daemon 2>&1 | head -50 || echo "gradle tasks failed too"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.build.outputs.exitcode == '0'
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Tomato Timer ${{ github.ref_name }}" \
            --notes "Download the APK and install it on your Android device." \
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
