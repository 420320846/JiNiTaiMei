name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install Android SDK 34
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$SDK" > local.properties
          export ANDROID_HOME=$SDK
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          ls $SDK/platforms/ 2>/dev/null
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "Installing platform 34..."
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            yes | $SDK/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1
          fi
          ls $SDK/platforms/android-34/ && echo "platform 34 OK"
          ls $SDK/build-tools/34.0.0/ && echo "build-tools 34.0.0 OK"

      - name: Build Debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Tomato Timer ${{ github.ref_name }}" \
            --notes "Download the APK and install it on your Android device." \
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
