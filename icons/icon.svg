<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- tomato body -->
  <circle cx="256" cy="240" r="140" fill="#e74c3c"/>
  <circle cx="256" cy="240" r="130" fill="#f5a623" opacity="0.15"/>
  <ellipse cx="210" cy="210" rx="45" ry="55" fill="#c0392b" opacity="0.3"/>
  <!-- stem -->
  <path d="M256 100 C256 70 240 50 230 40" stroke="#27ae60" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="256" cy="105" rx="18" ry="12" fill="#27ae60"/>
  <!-- clock face -->
  <circle cx="256" cy="240" r="95" fill="none" stroke="#fff" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="240" r="3" fill="#fff"/>
  <line x1="256" y1="240" x2="256" y2="175" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="240" x2="300" y2="260" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- minute ticks -->
  <g stroke="#fff" stroke-width="3" opacity="0.5">
    <line x1="256" y1="155" x2="256" y2="165"/>
    <line x1="335" y1="218" x2="327" y2="226"/>
    <line x1="335" y1="262" x2="327" y2="254"/>
    <line x1="256" y1="325" x2="256" y2="315"/>
    <line x1="177" y1="262" x2="185" y2="254"/>
    <line x1="177" y1="218" x2="185" y2="226"/>
  </g>
  <!-- rings -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="#fff" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="240" r="170" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.1"/>
</svg>
