name: Build APK

on:
  push:
    branches: [ main, android-app ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Install Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > android/local.properties
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            yes | $SDK/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || \
            (wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip && \
             unzip -q /tmp/clt.zip -d /tmp/clt && \
             mkdir -p $SDK/cmdline-tools/latest && \
             mv /tmp/clt/cmdline-tools/* $SDK/cmdline-tools/latest/ && \
             yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1)
          fi

      - name: Build APK
        continue-on-error: true
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Debug build output
        if: always()
        run: |
          echo "=== Build log (last 100) ==="
          tail -100 /tmp/build.log 2>/dev/null || echo "No log"
          echo "=== Search for APKs ==="
          find . -name "*.apk" 2>/dev/null | head -10 || echo "No APKs found"
          echo "=== Gradle output dir ==="
          find android -name "outputs" -type d 2>/dev/null | head -5 || echo "No outputs dir"
          echo "=== CWD ==="
          pwd
          echo "=== tree android ==="
          find android -maxdepth 5 -type d 2>/dev/null | head -30 || echo "error"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomato-app
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "Tomato Timer ${{ github.ref_name }}" \
              --notes "Download the APK and install it on your Android device." \
              "$APK"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
